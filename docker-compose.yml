version: "3.9"

services:
    api:
        build: .
        container_name: split-bill-api
        ports:
            - "8000:8000"
        volumes:
            - .:/app
        depends_on:
            - db
        env_file:
            - .env # 這裡之後放 DATABASE_URL 等設定

    db:
        image: postgres:15
        container_name: split-bill-db
        environment:
            POSTGRES_USER: admin
            POSTGRES_PASSWORD: test12345
            POSTGRES_DB: app_db
        ports:
            - "5432:5432"
        volumes:
            - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
            # 沒有掛 /var/lib/postgresql/data => 資料不會永久化
